# 每個交易日 16:30（台灣時間）更新類股指數日 K 與股票清單
name: daily-data

on:
  schedule:
    - cron: "30 8 * * 1-5" # UTC 08:30 = 台灣 16:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sector-history
      - run: npm run universe
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "每日資料 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
