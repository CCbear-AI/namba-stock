# 每個交易日 16:30（台灣時間）更新盤後資料、22:00 再補融資融券：全市場日 K、法人籌碼、融資券、期貨選擇權、類股指數、歷史高低、量能曲線
# 週六早上另外跑一次抓集保股權分散（每週五晚上公布）
name: daily-data

on:
  schedule:
    - cron: "30 8 * * 1-5" # UTC 08:30 = 台灣 16:30
    - cron: "0 14 * * 1-5" # 台灣 22:00：補抓 21:00 才公布的融資融券
    - cron: "0 1 * * 6" # 台灣週六 09:00：集保
  workflow_dispatch:

permissions:
  contents: write

# Supabase 準時觸發＋GitHub 自己的排程（備援）可能各跑一次，排隊依序跑
concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 盤後資料
        if: github.event.schedule != '0 1 * * 6'
        run: |
          npm run market-history
          npm run futures || echo "::warning::期貨資料抓取失敗，沿用舊資料"
          npm run sector-history
          npm run ath -- update
          npm run volcurve
          npm run universe
      - name: 集保股權分散
        run: npm run tdcc
      - name: 法人買超提醒推播
        if: github.event.schedule != '0 1 * * 6'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npm run push-insti
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "每日資料 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
