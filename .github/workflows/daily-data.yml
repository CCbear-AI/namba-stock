# 每個交易日 16:30（台灣時間）更新盤後資料、22:00 再補融資融券：全市場日 K、法人籌碼、融資券、期貨選擇權、類股指數、歷史高低、量能曲線、分點進出、盤後 AI 摘要、重大訊息、分點晚報、飆股晚報、自選收盤報告推播
# 週六早上另外跑一次抓集保股權分散（每週五晚上公布），接著寫一週回顧
name: daily-data

on:
  schedule:
    - cron: "30 8 * * 1-5" # UTC 08:30 = 台灣 16:30
    - cron: "0 14 * * 1-5" # 台灣 22:00：補抓 21:00 才公布的融資融券
    - cron: "0 1 * * 6" # 台灣週六 09:00：集保
  workflow_dispatch:

permissions:
  contents: write

# Supabase 準時觸發＋GitHub 自己的排程（備援）可能各跑一次，排隊依序跑
concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 盤後資料
        if: github.event.schedule != '0 1 * * 6'
        run: |
          npm run market-history
          npm run futures || echo "::warning::期貨資料抓取失敗，沿用舊資料"
          npm run sector-history
          npm run ath -- update
          npm run volcurve
          npm run universe
      - name: 分點進出
        # 補最近 5 個交易日裡還沒有的（16:30 富邦還沒更新的話，22:00 那次會補上）
        if: github.event.schedule != '0 1 * * 6'
        continue-on-error: true
        run: |
          npm run brokers -- --backfill 5
          npm run broker-class
      - name: 集保股權分散
        run: npm run tdcc
      - name: 一週回顧
        # 集保進來後寫這週的回顧並推播；只在週六、日寫，同一週寫過就略過（平日這步直接結束）
        continue-on-error: true
        env:
          IAI_API_KEY: ${{ secrets.IAI_API_KEY }}
          IAI_MODEL: ${{ vars.IAI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npm run weekly-review
      - name: 法人買超提醒推播
        if: github.event.schedule != '0 1 * * 6'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npm run push-insti
      - name: 盤後 AI 摘要
        if: github.event.schedule != '0 1 * * 6'
        continue-on-error: true
        env:
          IAI_API_KEY: ${{ secrets.IAI_API_KEY }}
          IAI_MODEL: ${{ vars.IAI_MODEL }}
        run: npm run ai-summary
      - name: 重大訊息
        # 證交所、櫃買中心開放資料（前一個交易日的公告）早上就放出，主要由早上 world-focus 排程摘要；這裡補早上沒寫完的
        if: github.event.schedule != '0 1 * * 6'
        continue-on-error: true
        timeout-minutes: 25
        env:
          IAI_API_KEY: ${{ secrets.IAI_API_KEY }}
          IAI_MODEL: ${{ vars.IAI_MODEL }}
        run: npm run news
      - name: 分點晚報
        # 分點資料是最新交易日才寫（通常 22:00 那次），寫好推播給有開「分點晚報」提醒的裝置；同一天只寫一次
        if: github.event.schedule != '0 1 * * 6'
        continue-on-error: true
        env:
          IAI_API_KEY: ${{ secrets.IAI_API_KEY }}
          IAI_MODEL: ${{ vars.IAI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npm run broker-report
      - name: 飆股晚報
        # 分點、融資進來後掃全市場起漲訊號（回測過）＋AI 說明前 15 檔，寫好推播「飆股晚報」；同一天只寫一次
        if: github.event.schedule != '0 1 * * 6'
        continue-on-error: true
        timeout-minutes: 20
        env:
          IAI_API_KEY: ${{ secrets.IAI_API_KEY }}
          IAI_MODEL: ${{ vars.IAI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npm run surge
      - name: 自選收盤報告推播
        # 分點資料進來後，替有開「自選收盤報告」提醒的裝置各推一則（同一天只推一次）
        if: github.event.schedule != '0 1 * * 6'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npm run wl-push
      - name: 存檔
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "每日資料 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: 通知 Vercel 部署
        # GitHub 推送偶爾沒觸發 Vercel 自動部署（10/27 盤後摘要沒上線），推送後主動打部署鉤子
        if: ${{ steps.save.outputs.pushed == 'true' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "沒設 VERCEL_DEPLOY_HOOK，略過"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "已通知 Vercel 部署"
