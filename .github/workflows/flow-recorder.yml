# 盤中資金流記錄：交易日 08:50（台灣時間）啟動，09:00–13:30 每 30 秒記一筆，收盤後把當天紀錄 commit 回 repo
name: flow-recorder

on:
  schedule:
    # GitHub 排程常常延遲（曾經晚 4.5 小時），主要改由 Supabase pg_cron 準時觸發（supabase/cron.sql），這裡留著當備援；同時只會跑一個，其他的排隊，輪到時已收盤就直接結束
    - cron: "20 0 * * 1-5" # 台灣 08:20
    - cron: "35 0 * * 1-5" # 台灣 08:35
    - cron: "50 0 * * 1-5" # 台灣 08:50
  workflow_dispatch:
    inputs:
      test:
        description: "測試輪數（填數字就不管時間跑幾輪、不存檔；留空 = 正式記錄）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: flow-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 記錄資金流
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npm run flow-recorder ${{ inputs.test && format('-- --test {0}', inputs.test) || '' }}
      - name: 存檔
        id: save
        if: ${{ !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flow
          if git diff --cached --quiet; then echo "沒有新紀錄"; exit 0; fi
          git commit -m "資金流紀錄 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: 通知 Vercel 部署
        # GitHub 推送偶爾沒觸發 Vercel 自動部署（10/27 盤後摘要沒上線），推送後主動打部署鉤子
        if: ${{ steps.save.outputs.pushed == 'true' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "沒設 VERCEL_DEPLOY_HOOK，略過"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "已通知 Vercel 部署"
